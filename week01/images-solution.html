<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Image</title>
</head>

<body>
    <h1>The Temple</h1>
    <p>This is an image of the beautiful temple in Accra, Ghana:</p>
    <img src="images/temple-small.jpg" alt="The Accra Ghana Temple" width="200" height="200">
    
    <p>A temple image file in the images subfolder:</p>
    <img src="aba-nigeria-temple.jpeg" alt="The Aba Nigeria Temple" width="200" height="200">

    <p>A temple image file in the root images folder:</p>
    <img src="salt-lake-temple.jpg" alt="The Salt Lake Temple" width="200" height="200">

    <p>A temple image file with an absolute path:</p>
    <img src="anchorage-temple-lds-253274-wallpaper.jpg" alt="The Anchorage Alaska Temple" width="200" height="200">
</body>

</html>
